name: Build installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and package DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: bash packaging/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: dist/*.dmg
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained Windows application
        run: dotnet publish windows/PocketPlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o build/windows
      - name: Fetch verified runtime
        run: python packaging/fetch-runtime.py windows x64 build/windows/runtime
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: dist/*.exe
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Pocket Play $GITHUB_REF_NAME (Preview)" --notes 'Download macOS arm64 for Apple Silicon, macOS x86_64 for Intel, or Windows x64 Setup. JRE and SDK tools included; first run downloads the Android/Google Play image after license consent. Preview: unsigned/not notarized; Intel and Windows emulator runtime require real-device testing. Windows requires virtualization and Windows Hypervisor Platform. See README for limitations.' *.dmg *.exe SHA256SUMS.txt
